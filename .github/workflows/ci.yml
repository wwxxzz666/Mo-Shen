name: CI

on:
  push:
    branches: [main, agentscope-mo-shen]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Compile Python sources
        run: python -m compileall -q storyagents
      - name: Run Python tests
        run: python -m pytest -q

  frontend-tests:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check storyagents/h5/sse.js
          node --check storyagents/h5/app.js
      - name: Run SSE contract tests
        run: node --test tests/frontend/*.test.js
