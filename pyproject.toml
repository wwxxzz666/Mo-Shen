[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "storyagents"
version = "2.0.1"
description = "StoryAgents: Multi-Agent LLM Fiction Drafting Framework (AgentScope)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agentscope>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
]

[project.scripts]
storyagents = "storyagents.cli:app"

[tool.setuptools.packages.find]
include = ["storyagents*"]

[tool.setuptools.package-data]
storyagents = ["h5/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
